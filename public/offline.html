<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אין חיבור לאינטרנט | ml_tlv</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 70% 60%, rgba(168, 85, 247, 0.06) 0%, transparent 50%);
      animation: bgShift 15s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes bgShift {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(-5%, -5%) rotate(5deg); }
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 420px;
    }

    .logo-container {
      width: 100px;
      height: 100px;
      margin: 0 auto 2rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .logo-container img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    /* Pulsing wifi icon */
    .wifi-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 1.5rem;
      position: relative;
    }

    .wifi-icon svg {
      width: 100%;
      height: 100%;
      opacity: 0.4;
    }

    .wifi-slash {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 56px;
      height: 3px;
      background: #ef4444;
      transform: translate(-50%, -50%) rotate(-45deg);
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 900;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.9rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #fff;
      color: #000;
      border: none;
      padding: 14px 32px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 24px rgba(255, 255, 255, 0.1);
    }

    .retry-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 32px rgba(255, 255, 255, 0.15);
    }

    .retry-btn:active {
      transform: scale(0.97);
    }

    .retry-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.5s;
    }

    .retry-btn:hover svg {
      transform: rotate(180deg);
    }

    .footer-text {
      position: fixed;
      bottom: 2rem;
      color: rgba(255, 255, 255, 0.15);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="logo-container">
      <img src="/logo_v3.png" alt="ml_tlv" />
    </div>

    <div class="wifi-icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.14 0M1.394 9.393c5.857-5.858 15.355-5.858 21.213 0" />
      </svg>
      <div class="wifi-slash"></div>
    </div>

    <h1>אין חיבור לאינטרנט</h1>
    <p>
      נראה שהחיבור לרשת נפל.<br>
      בדוק את חיבור ה-WiFi או הנתונים הסלולריים ונסה שוב.
    </p>

    <button class="retry-btn" onclick="window.location.reload()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      נסה שוב
    </button>
  </div>

  <div class="footer-text">ml_tlv — יוקרה בחתיכות קטנות</div>
</body>
</html>
